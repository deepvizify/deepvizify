<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description"
    content="DeepVizify — AI-powered data analytics and visualization platform. Transform your data into actionable insights." />
  <meta name="theme-color" content="#e8920d" />

  <!-- Preconnect to critical origins for faster resource loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://supabase.co" />
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <title>DeepVizify - AI Analytics & Data Visualization Platform</title>
  <meta name="author" content="DeepVizify" />

  <meta property="og:title" content="DeepVizify — AI Analytics Platform" />
  <meta property="og:description" content="Transform your data into actionable insights with AI-powered analytics." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.deepvizify.com/" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="DeepVizify — AI Analytics Platform" />
  <meta name="twitter:description" content="Transform your data into actionable insights with AI-powered analytics." />

  <!-- SEO: Canonical URL -->
  <link rel="canonical" href="https://www.deepvizify.com/" />

  <!-- SEO: Robots directive -->
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

  <!-- SEO: Keywords -->
  <meta name="keywords"
    content="AI analytics, data visualization, machine learning, EDA engine, data analytics platform, DeepVizify, ML Studio, data forecasting, SQL lab, data cleaning tool, AI-powered insights, business analytics" />

  <!-- Critical CSS: Inline loading spinner shown before any JS loads -->
  <style>
    #root:empty {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #000;
    }

    #root:empty::after {
      content: '';
      width: 40px;
      height: 40px;
      border: 4px solid rgba(232, 146, 13, 0.3);
      border-top-color: #e8920d;
      border-radius: 50%;
      animation: app-spin 0.8s linear infinite;
    }

    @keyframes app-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

  <!-- SEO: JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "name": "DeepVizify",
        "url": "https://www.deepvizify.com",
        "description": "AI-powered data analytics and visualization platform",
        "sameAs": []
      },
      {
        "@type": "WebSite",
        "name": "DeepVizify",
        "url": "https://www.deepvizify.com",
        "description": "AI-powered data analytics and visualization platform. Transform your data into actionable insights.",
        "publisher": {
          "@type": "Organization",
          "name": "DeepVizify"
        }
      },
      {
        "@type": "SoftwareApplication",
        "name": "DeepVizify",
        "url": "https://www.deepvizify.com",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "AI-powered data analytics and visualization platform with ML Studio, EDA Engine, and advanced data visualization tools.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "description": "Free tier available"
        }
      }
    ]
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <noscript>
    <div
      style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#000;color:#fff;font-family:system-ui;text-align:center;padding:2rem;">
      <p>Please enable JavaScript to use DeepVizify.</p>
    </div>
  </noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
